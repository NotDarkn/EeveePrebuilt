name: Clean Workflows (SCHEDULED)

on:
  schedule:
    - cron: "0 12 */3 * *" # Runs every 3 days

permissions:
  actions: write    

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: igorjs/gh-actions-clean-workflow@v8
        with:
          runs_older_than: 0
          runs_to_keep: 0