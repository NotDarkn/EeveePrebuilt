name: Build EeveeReincarnatedIPAs (DUAL)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build from"
        default: "Master"
        required: true
        type: string 
      ipa_url:
        description: "URL to a decrypted Spotify IPA"
        required: true
        type: string
      spotify_version:
        description: "Spotify version (e.g. 9.1.56)"
        default: "9.1.56"
        required: true
        type: string

env:
  THEOS: ${{ github.workspace }}/theos
  SWIFTPROTOBUF_VERSION: "1.29.0"

jobs:
  build-deb:
    runs-on: macos-latest
    outputs:
      commit_id: ${{ steps.EEVEE_REINCARNATED_COMMIT_ID.outputs.COMMIT_ID }}
    steps:

      - name: Checkout EeveeReincarnatedIPA
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

        # this grabs the latest commit ID from jaydenjcpy's EeveeSpotifyReincarnated repo 
        # then it's cut down to the first 7 characters for the shortened commit ID that is used for naming files
      - name: Setup Commit ID
        id: EEVEE_REINCARNATED_COMMIT_ID
        run: |
          COMMIT_FULL=$(git ls-remote https://github.com/jaydenjcpy/EeveeSpotifyReincarnated.git ${{ inputs.branch }} | cut -f1)
          COMMIT=${COMMIT_FULL:0:7}
          echo "COMMIT_ID=$COMMIT" >> $GITHUB_OUTPUT

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: Setup Theos
        uses: actions/checkout@v7
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: Install deb build tools
        run: |
          brew trust aws/tap azure/bicep
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Grab EeveeSwiftProtobuf.framework latest commit ID
        run: |
          PROTOBUF_COMMIT=$(git log -1 --format="%h" -- Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh)
          echo "PROTOBUF_COMMIT_ID=$PROTOBUF_COMMIT" >> $GITHUB_ENV

      - name: Grab EeveeSwiftProtobuf.framework from cache
        id: protobuf-cache
        uses: actions/cache@v5
        with:
          # /Users/runner/work/EeveeReincarnatedIPA/EeveeReincarnatedIPA/theos/lib/iphone/rootless/EeveeSwiftProtobuf.framework
          # env.THEOS is /Users/runner/work/EeveeReincarnatedIPA/EeveeReincarnatedIPA/theos
          # the rest of the path is just where EeveeSwiftProtobuf.framework is.
          path: ${{ env.THEOS }}/lib/iphone/rootless/EeveeSwiftProtobuf.framework
          # this should end up being like "eeveeswiftprotobuf-1.29.0"
          key: eeveeswiftprotobuf-${{ env.PROTOBUF_COMMIT_ID }}-cache

        # hopefully, this should only run if the above step (cache) doesn't exist
      - name: Build EeveeSwiftProtobuf.framework from source
        if: steps.protobuf-cache.outputs.cache-hit != 'true'
        env:
          SWIFTPROTOBUF_VERSION: ${{ env.SWIFTPROTOBUF_VERSION }}
        run: |
          chmod +x Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh
          Tools/SwiftProtobufBuild/build-eeveeswiftprotobuf.sh

        # this should save another like 10 to 15s as it'll already have Swift Support Tools built
      - name: Grab Swift Support Tools from cache
        id: swift-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.THEOS }}/vendor/swift-support/.theos_build
          key: swift_tools-cache
        
        # if this works, it should save roughly 3 to 4 minutes for future workflow runs
      - name: Grab Orion Preprocessor from cache
        id: theos-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.THEOS }}/vendor/orion/.theos_build
          key: theos_build-cache

      - name: Build .deb (rootless)
        run: THEOS_PACKAGE_SCHEME=rootless make package FINALPACKAGE=1
      
      - name: Find .deb artifact
        env:
          COMMIT_ID: ${{ steps.EEVEE_REINCARNATED_COMMIT_ID.outputs.COMMIT_ID }}
        run: |
          DEB_PATH=$(find packages -name "com.eevee.spotify_*.deb" | head -1)
          [ -n "$DEB_PATH" ] || { echo "deb not produced" >&2; exit 1; }
          DEB_RENAME="packages/com.eevee.spotify_${COMMIT_ID}_iphoneos-arm64.deb"
          mv "$DEB_PATH" "$DEB_RENAME"
          echo "DEB_PATH=$DEB_RENAME" >> $GITHUB_ENV
          echo "DEB_NAME=$(basename "$DEB_RENAME")" >> $GITHUB_ENV

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: com.eevee.spotify_${{ steps.EEVEE_REINCARNATED_COMMIT_ID.outputs.COMMIT_ID }}_iphoneos-arm64
          path: ${{ env.DEB_PATH }}
          if-no-files-found: error

  build-ipa:
    needs: build-deb
    runs-on: macos-latest
    strategy:
      matrix:
        variant:
          - Unpatched
          - Patched
    env:
      COMMIT_ID: ${{ needs.build-deb.outputs.commit_id }}
      SPOT_VERSION: ${{ github.event.inputs.spotify_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          submodules: recursive

      - name: (PATCHED) Setup Theos
        uses: actions/checkout@v7
        if: matrix.variant == 'Patched'
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - name: (UNPATCHED) Install IPA tools
        if: matrix.variant == 'Unpatched'
        run: |
          brew trust aws/tap azure/bicep
          brew install dpkg
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64

      - name: (PATCHED) Install IPA tools
        if: matrix.variant == 'Patched'
        run: |
          brew trust aws/tap azure/bicep
          brew install dpkg ldid
          python3 -m pip install --upgrade --break-system-packages \
              git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m); [ "$ARCH" = "x86_64" ] && SUFFIX=macos-amd64 || SUFFIX=macos-arm64
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" \
              -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: com.eevee.spotify_${{ env.COMMIT_ID }}_iphoneos-arm64
          path: deb

      - name: Download decrypted .ipa
        run: |
          wget "${{ inputs.ipa_url }}" --no-verbose -O ${{ github.workspace }}/spotify.ipa
          file_type=$(file --mime-type -b ${{ github.workspace }}/spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Not a valid IPA: $file_type"
            exit 1
          fi

      - name: Fetch OpenSpotifySafariExtension.appex
        run: |
          EXT_DIR="$RUNNER_TEMP/OpenSpotifySafariExtension"
          rm -rf "$EXT_DIR"
          git clone --depth 1 https://github.com/BillyCurtis/OpenSpotifySafariExtension.git "$EXT_DIR"
          EXT_SRC="$EXT_DIR/OpenSpotifySafariExtension.appex"
          [ -e "$EXT_SRC" ] || { echo "OpenSpotifySafariExtension.appex not found in repo" >&2; exit 1; }
          echo "OPENSPOTIFY_APPEX=$EXT_SRC" >> $GITHUB_ENV

      - name: Inject deb + framework into IPA (cyan)
        run: |
          mkdir -p Outputs/IPAS
          DEB_EXTRACT="$RUNNER_TEMP/deb-extract"
          mkdir -p "$DEB_EXTRACT"
          DEB_PATH=$(find deb -name "*.deb" | head -1)
          dpkg-deb -R "$DEB_PATH" "$DEB_EXTRACT"

          DYLIB_SRC=$(find "$DEB_EXTRACT" -name 'EeveeSpotify.dylib' | head -1)
          BUNDLE_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSpotify.bundle' | head -1)
          FRAMEWORK_SRC=$(find "$DEB_EXTRACT" -type d -name 'EeveeSwiftProtobuf.framework' | head -1)
          OUT="Outputs/IPAS/EeveeReincarnatedIPA-${{ matrix.variant }}-${COMMIT_ID}-${SPOT_VERSION}.ipa"

          INJECT=("$DYLIB_SRC")
          [ -n "$FRAMEWORK_SRC" ] && INJECT+=("$FRAMEWORK_SRC")
          [ -n "$BUNDLE_SRC" ]    && INJECT+=("$BUNDLE_SRC")

          # -d enable documents, -u drop UISupportedDevices, -m floor MinOS,
          # -c max compress. Watch + native appex strip happens in the next
          # step via Tools/strip-ipa.sh.
          cyan -i ${{ github.workspace }}/spotify.ipa -o "$OUT" \
               -f "${INJECT[@]}" -c 9 -m 15.0 -du
          echo "OUT_IPA=$OUT" >> $GITHUB_ENV

      - name: (PATCHED) Grab zxPluginsInject.dylib latest commit ID
        if: matrix.variant == 'Patched'
        run: |
          zxPluginsInject_COMMIT=$(git log -1 --format="%h" -- Tools/build-zxpi.sh)
          echo "zxPluginsInject_COMMIT_ID=$zxPluginsInject_COMMIT" >> $GITHUB_ENV

      - name: (PATCHED) Grab zxPluginsInject.dylib from cache
        if: matrix.variant == 'Patched'
        id: zxPluginsInject-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/packages/zxPluginsInject.dylib
          key: zxPluginsInject-${{ env.zxPluginsInject_COMMIT_ID }}-cache
          
      - name: (PATCHED) Build zxPluginsInject.dylib from source
        if: matrix.variant == 'Patched' && steps.zxPluginsInject-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x Tools/build-zxpi.sh
          Tools/build-zxpi.sh

      - name: (PATCHED) LC-inject zxPluginsInject
        if: matrix.variant == 'Patched'
        run: |
          ipapatch --input "$OUT_IPA" --inplace --noconfirm \
                   --dylib packages/zxPluginsInject.dylib

      - name: (UNPATCHED) Strip incompatible bundles
        if: matrix.variant == 'Unpatched'
        run: |
          chmod +x Tools/strip-ipa.sh
          Tools/strip-ipa.sh "$OUT_IPA"

      - name: (UNPATCHED) Add OpenSpotifySafariExtension.appex
        if: matrix.variant == 'Unpatched'
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"

          mkdir -p "Payload/Spotify.app/PlugIns"
          cp -R "$OPENSPOTIFY_APPEX" "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"

          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload

      - name: (PATCHED) Add OpeninSafariSpotifyExtension.appex
        if: matrix.variant == 'Patched'
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"

          mkdir -p "Payload/Spotify.app/PlugIns"
          rm -rf "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"
          cp -R "$OPENSPOTIFY_APPEX" "Payload/Spotify.app/PlugIns/OpenSpotifySafariExtension.appex"

          # Repack only the Payload folder back into the IPA
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload
      
      - name: Strip Watch app (if any survived)
        run: |
          cd "$(dirname "$OUT_IPA")"
          rm -rf Payload
          unzip -q "$(basename "$OUT_IPA")"
          if [ -d "Payload/Spotify.app/com.apple.WatchPlaceholder" ]; then
            rm -rf Payload/Spotify.app/com.apple.WatchPlaceholder
          fi
          if [ -d "Payload/Spotify.app/Watch" ]; then
            rm -rf Payload/Spotify.app/Watch
          fi
          rm -f "$(basename "$OUT_IPA")"
          zip -qry "$(basename "$OUT_IPA")" Payload
          rm -rf Payload
          
      - name: Stage alternate app icons
        run: |
          chmod +x Tools/alt-icons.sh
          Tools/alt-icons.sh "$OUT_IPA"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: EeveeReincarnatedIPA-${{ matrix.variant }}
          path: ${{ env.OUT_IPA }}
          if-no-files-found: error    

  github-release:
    needs: [build-ipa, build-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      COMMIT_ID: ${{ needs.build-deb.outputs.commit_id }}
    steps:
      - name: Checkout (for tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download .deb artifact
        uses: actions/download-artifact@v8
        with:
          name: com.eevee.spotify_${{ env.COMMIT_ID }}_iphoneos-arm64
          path: release_files/deb

      - name: Download unpatched IPA
        uses: actions/download-artifact@v8
        with:
          name: EeveeReincarnatedIPA-Unpatched
          path: release_files/unpatched

      - name: Download patched IPA
        uses: actions/download-artifact@v8
        with:
          name: EeveeReincarnatedIPA-Patched
          path: release_files/patched

      - name: Get previous tag (for description)
        run: |
          git fetch --tags
          PREV_TAG=$(git tag --sort=-creatordate | head -n 1)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ github.event.inputs.spotify_version }}-${{ env.COMMIT_ID }}"
          name: "${{ github.event.inputs.spotify_version }} // ${{ env.COMMIT_ID }}"
          body: |
            # EeveeSpotifyReincarnated [`${{ env.COMMIT_ID }}`](https://github.com/jaydenjcpy/EeveeSpotifyReincarnated/commit/${{ env.COMMIT_ID }})
            This version pulls the latest changes made up to the commit `${{ env.COMMIT_ID }}` in the [EeveeSpotifyReincarnated](https://github.com/jaydenjcpy/EeveeSpotifyReincarnated) repo. 

            ## Changelogs (vs. [${{ env.PREV_TAG }}](https://github.com/NotDarkn/EeveeReincarnatedIPAs/releases/tag/${{ env.PREV_TAG }}))

            ## Unpatched vs. Patched
            Unpatched → Use if you're using a **Free Developer Account** to sideload. (e.g. [Sideloadly](https://sideloadly.io) / [PlumeImpactor](https://github.com/claration/Impactor))

            Patched → Use if you're using **TrollStore** or a **Paid Developer Certificate** to sideload.

            ## Credits
            @whoeevee - [EeveeSpotify](https://github.com/whoeevee/EeveeSpotifyReborn)
            @jaydenjcpy - [EeveeSpotifyReincarnated](https://github.com/jaydenjcpy/EeveeSpotifyReincarnated)
            @estrogencat - [EeveeIPA](https://github.com/estrogencat/EeveeIPA)

            > [!NOTE]
            > the `.deb` files are just the tweak files if you want to inject EeveeSpotifyReincarnated into your own **decrypted** Spotify app.
          draft: true
          prerelease: false
          files: |
            release_files/**/*.ipa
            release_files/**/*.deb
